# Anam configuration — copy to ~/.config/anam/config.yaml
#
# Anam looks for a config file in this order, and stops at the first hit:
#
#   1. --config <path>                     explicit; missing is an error
#   2. $ANAM_CONFIG                        explicit; missing is an error
#   3. <user config dir>/anam/config.yaml  discovered; missing is fine
#
# The user config dir is $XDG_CONFIG_HOME if set, otherwise ~/.config.
#
# Every key can be overridden by an ANAM_-prefixed environment variable
# (ANAM_LEDGER_PATH, ANAM_PERSON_ID, ...). An unrecognised key is an error, not a
# shrug: a silently-ignored `ledger_pth` would leave Anam writing to the default
# ledger while you believed it was writing to yours.
#
# Anam stores in two places and a folder of documents (ARCHITECTURE.md §8): the
# ledger is the record; the operational store holds what Anam derives and authors,
# receipts and saved selections included. Each of the operational store's tables
# records where it comes back from, the derived tier by replaying the ledger, the
# rest from git or from a backup. artifact_dir, which once held receipts and
# checkpoint values as files, is gone; `anam move-artifacts` reads an old folder in.

# Whose timeline this is. Pinned into the ledger by `anam init`; a ledger pinned
# to another person is refused. Required, and deliberately without a default.
person_id: matt

# --- the ledger: SQLite, in a file of its own ----------------------------------
# Facet artifacts and anam-events. `commit` writes both in one transaction.
# Append-only is enforced by triggers in the file. Commands that only read open
# it read-only.
#
# This file is the record. Payloads could be re-ingested from their sources; the
# anam-times could not. Back it up with
#   sqlite3 ledger.db ".backup /path/to/copy.db"
# A plain file copy can miss recent commits still in ledger.db-wal.
# Must not be the same file as db_path.
# Defaults to $XDG_DATA_HOME/anam/ledger.db, else ~/.local/share/anam/.
ledger_path: ~/.local/share/anam/ledger.db

# --- operational store: SQLite ------------------------------------------------
# Definitions, projection templates, token scopes, the facet and anam-event
# indexes, the checkpoint log and its values, receipts, served values and saved
# selections, sync cursors.
# Not a cache: the derived tables replay back from the ledger, but definitions
# come from git and receipts and saved selections come from nowhere. Back this
# file up.
# Defaults to $XDG_DATA_HOME/anam/tracking.db, else ~/.local/share/anam/.
db_path: ~/.local/share/anam/tracking.db

# --- the library: document bytes ------------------------------------------------
# Only Anam writes it (POST /v1/documents), naming each file by its sha256.
# Defaults to documents/ beside the ledger. Back it up with the ledger.
# library_dir: ~/.local/share/anam/documents

# How many files one library folder holds before a new one goes into a subfolder
# named by the start of its sha256. It places new files only; a stored file never
# moves and is found by its name, so changing it strands nothing.
library_folder_limit: 1000

# Bounds every call to a store. Anam fails fast rather than hanging.
timeout: 5s

# Where `anam daemon` serves the API, the inspector and /healthz. Without a
# token_file it must be loopback.
listen: 127.0.0.1:8787

# The daemon's bearer token, one line of at least 32 characters
# (`openssl rand -hex 24 > token`). With it, every request but /healthz must carry
# it, as a bearer token or as a basic-auth password, and listen may be any address.
# token_file: ~/.config/anam/token

# The importers the daemon accepts envelopes and Definitions from, each under its
# own token, held here only as a SHA-256 (docs/IMPORTERS.md §8):
#   importers:
#     - source: withings
#       token_sha256: <printf %s "$token" | sha256sum>
#       types: [health.weight]
#     - source: conversation           # the person speaking: any type, owns none
#       token_sha256: <printf %s "$token" | sha256sum>
#       any_type: true
# The same file names other principals, each with a role (docs/API.md §2):
#   principals:
#     - name: assistant
#       role: reader
#       token_sha256: <printf %s "$token" | sha256sum>
#       receipts: always                 # file every read this token makes as a receipt naming it
# importers_file: ~/.config/anam/importers.yaml

# The catalog: the Facet Definitions and projection templates this deployment runs on.
# Unset, each is the catalog built into the binary. Set, a directory replaces the
# built-in one for that component (it is not added to it): current manifests at its
# root, earlier versions under history/. The two are chosen independently. Each is read
# once at start; a directory that is missing or unreadable stops the start, and the
# daemon never falls back to the built-in catalog or creates the directory. A relative
# path is from the working directory, so prefer an absolute one in service config.
# Start from a copy of internal/def/manifests and internal/projection/manifests; keep
# the file names and bytes, since a receipt names the definition set's version.
# definitions_dir: /etc/anam/definitions
# projections_dir: /etc/anam/projections

# Bounds one long write inside the daemon: an index replay, a backup, the mint at
# start. Also each phase of `anam migrate`: the fold of the old ledger, the carry. Its old name, ingest_timeout (ANAM_INGEST_TIMEOUT), is still read with a
# warning; the two set differently are refused.
long_write_timeout: 15m

# --- bucketing ----------------------------------------------------------------
# How much fact-time one checkpoint bucket covers: `monthly` or `weekly`.
#
# A tuning knob, and only that — it changes nothing a read returns. It trades how
# many facets a checkpoint folds against how many values a long read stitches:
# narrow buckets make a re-mint cheap and a lifelong read expensive, wide ones the
# reverse. Monthly suits this record's density (~200 facets a bucket, 31 buckets);
# a dense source like Garmin's monitoring tables would argue for weekly.
#
# It is also stamped into every bucket id the facet index persists, so changing it
# is a rebuild: the operational store refuses a database built at another width,
# and the fix is to delete tracking.db (never ledger.db) and re-run `anam init`.
# The derived tier replays from the ledger, so that costs time, not facts.
bucket_width: monthly

# The most bytes one checkpoint's value holds before the mint splits its bucket
# along the calendar, a year into months and a month into days. 0 mints at the
# fixed bucket_width. The default re-derives in about 50 ms on the NAS.
checkpoint_budget: 1048576

# --- the reader ---------------------------------------------------------------
# The zone a bare date on the command line is read in and fact-times are shown in.
# Local is this machine's; a read sent to a daemon carries its IANA name. The daemon's
# Workbench pages read a bare date in this zone when a request names none (the pages
# take a zone parameter).
# zone: Australia/Sydney

# A running daemon to ask instead of opening the files (scheme and host only).
# server: http://192.168.20.4:8787

# The most one read over the daemon answers with, in bytes; past it the read is
# refused with what narrows it. 0 is no bound. A month of every type is under the
# default; the whole record is not.
max_read_bytes: 524288

# The projection an agent should read first, advertised on GET /v1/status and
# GET /v1/projections and named by the MCP's describe_record. It is advice, not
# applied: a read that names no projection is unchanged. It must be a bundled or
# registered projection or the daemon will not start. Empty is none.
# default_projection: recent-life

# --- backups ------------------------------------------------------------------
# Where POST /v1/backups writes, one directory per backup, on another disk from
# the record. Unset, the daemon takes none.
# backup_dir: /mnt/backup/anam
# How many backups to keep: two weeks of nightly ones.
backup_keep: 14

# --- limits ----------------------------------------------------------
# Every value below is Anam's opinionated default and a choice you can make
# differently. Each is range-checked at start, so a bad one stops the daemon or the
# CLI there and not at the first request that uses it. Durations are Go durations
# (250ms, 5s, 2m, 24h). Values Anam does not offer here are invariants, and the code
# says beside each why it cannot change (AGENTS.md, "Defaults and invariants").

# The daemon's HTTP server. Headers are a few hundred bytes; a 64 MiB document
# crosses the home network well inside the read timeout; the inspector's
# whole-record page (about 5 MB) writes in seconds; importers' batches arrive
# seconds apart.
http_read_header_timeout: 5s
http_read_timeout: 30s
http_write_timeout: 2m
http_idle_timeout: 2m
# How long shutdown waits for requests in flight; each is already bounded by
# timeout, so this only has to cover one.
shutdown_grace: 10s

# The write queue. One write runs at a time. An operator's write (a mint) waits
# accept_wait for it and is then refused as busy; an importer's batch waits
# importer_wait, long enough to wait out the mint after the batch before it. A
# busy answer (503) asks the caller to wait retry_after, in whole seconds, since
# what holds the queue that long is a backup or a full mint.
accept_wait: 250ms
importer_wait: 5s
retry_after: 15s
# How long the mint worker waits for batches to stop arriving before it mints, so
# an importer's hundred batches get one mint and not a hundred.
mint_quiet: 2s

# Admission. The most one payload, one registered Definition and one posted
# document may hold, in bytes. A batch's body is bounded by 49 payloads plus
# 1 MiB. commit_retries is how often a batch that lost the race for the watermark
# is tried again before the gate reports contention.
max_payload_bytes: 307200
max_manifest_bytes: 1048576
max_document_bytes: 67108864
commit_retries: 5

# Complete resends (snapshots). An incomplete one is dropped after snapshot_ttl;
# a source keeps its snapshot_keep newest complete ones (the newest is what
# retraction plans from). A report lists at most max_absent_ids ids and judges at
# most max_absent_judged live facets before it is 413 and the CLI lists them.
snapshot_ttl: 24h
snapshot_keep: 2
max_snapshot_parts: 100000
max_absent_ids: 1000
max_absent_judged: 5000

# The CLI as a client of a daemon. It reads at most max_response_bytes of one
# answer (the whole-person timeline is about 5 MB) and waits network_margin longer
# than it asks the daemon to take.
max_response_bytes: 67108864
network_margin: 10s

# How many historical (as-of) reads the inspector keeps folded; 0 keeps none.
inspect_cached_reads: 4
