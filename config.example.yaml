# Anam configuration — copy to ~/.config/anam/config.yaml
#
# Anam looks for a config file in this order, and stops at the first hit:
#
#   1. --config <path>                     explicit; missing is an error
#   2. $ANAM_CONFIG                        explicit; missing is an error
#   3. <user config dir>/anam/config.yaml  discovered; missing is fine
#
# The user config dir is $XDG_CONFIG_HOME if set, otherwise ~/.config.
#
# Every key can be overridden by an ANAM_-prefixed environment variable
# (ANAM_LEDGER_PATH, ANAM_PERSON_ID, ...). An unrecognised key is an error, not a
# shrug: a silently-ignored `ledger_pth` would leave Anam writing to the default
# ledger while you believed it was writing to yours.
#
# Anam stores in three places (ARCHITECTURE.md §8): the ledger is the record;
# files hold published artifacts; the operational store holds what Anam derives
# and authors. Each of the operational store's tables records where it comes back
# from — the derived tier by replaying the ledger, the rest from git or from a
# backup.

# Whose timeline this is. Pinned into the ledger by `anam init`; a ledger pinned
# to another person is refused. Required, and deliberately without a default.
person_id: matt

# --- the ledger: SQLite, in a file of its own ----------------------------------
# Facet artifacts and anam-events. `commit` writes both in one transaction.
# Append-only is enforced by triggers in the file. Commands that only read open
# it read-only.
#
# This file is the record. Payloads could be re-ingested from their sources; the
# anam-times could not. Back it up with
#   sqlite3 ledger.db ".backup /path/to/copy.db"
# A plain file copy can miss recent commits still in ledger.db-wal.
# Must not be the same file as db_path.
# Defaults to $XDG_DATA_HOME/anam/ledger.db, else ~/.local/share/anam/.
ledger_path: ~/.local/share/anam/ledger.db

# --- operational store: SQLite ------------------------------------------------
# Definitions, projection templates, token scopes, the facet and anam-event
# indexes, the span registry and per-span V/Wv, checkpoint and receipt index,
# saved span bookmarks, sync cursors, GC state.
# Not a cache: the derived tables replay back from the ledger, but definitions
# come from git and the bookmarks come from nowhere. Back this file up.
# Defaults to $XDG_DATA_HOME/anam/tracking.db, else ~/.local/share/anam/.
db_path: ~/.local/share/anam/tracking.db

# --- published artifacts: files -----------------------------------------------
# Content-addressed checkpoint values and served receipts. Immutable. These are
# authored, not rebuildable — back them up.
artifact_dir: ~/.local/share/anam/artifacts

# Bounds every call to a store. Anam fails fast rather than hanging.
timeout: 5s

# Where `anam daemon` serves the API, the inspector and /healthz. Without a
# token_file it must be loopback.
listen: 127.0.0.1:8787

# The daemon's bearer token, one line of at least 32 characters
# (`openssl rand -hex 24 > token`). With it, every request but /healthz must carry
# it, as a bearer token or as a basic-auth password, and listen may be any address.
# token_file: ~/.config/anam/token

# Bounds one whole ingest run inside the daemon.
ingest_timeout: 15m

# --- bucketing ----------------------------------------------------------------
# How much fact-time one checkpoint bucket covers: `monthly` or `weekly`.
#
# A tuning knob, and only that — it changes nothing a read returns. It trades how
# many facets a checkpoint folds against how many values a long read stitches:
# narrow buckets make a re-mint cheap and a lifelong read expensive, wide ones the
# reverse. Monthly suits this record's density (~200 facets a bucket, 31 buckets);
# a dense source like Garmin's monitoring tables would argue for weekly.
#
# It is also stamped into every bucket id the facet index persists, so changing it
# is a rebuild: the operational store refuses a database built at another width,
# and the fix is to delete tracking.db (never ledger.db) and re-run `anam init`.
# The derived tier replays from the ledger, so that costs time, not facts.
bucket_width: monthly
