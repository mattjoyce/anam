# Anam imports — the declared captures `anam ingest` runs (and the only kind it
# accepts). Copy to <user config dir>/anam/imports.yaml (usually
# ~/.config/anam/imports.yaml), or point at it with --imports / $ANAM_IMPORTS.
#
# Paths are expanded on load: ~ and $VARs work. At ingest time each path must
# resolve (symlinks followed) to an existing directory.
#
# Two sources are built in: records (hand-written YAML records) and documents (a
# folder of files with sidecars). Every vendor source reaches Anam through an
# importer in the anam-importers repository, under its own token
# (docs/IMPORTERS.md §8): Withings, the blood pressure export, the DreamStation
# card, Garmin and OwnTracks all arrive that way. The last built-in vendor worker,
# health-db, retired with card 55 on 2026-10-11; records and documents follow
# when their importers go live (cards 118, 103, 119).
imports:
  - source: records
    path: ~/anam/records
  - source: documents
    path: ~/anam/documents
