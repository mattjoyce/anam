openapi: 3.1.0
# The daemon's API, hand-written (card 49). internal/daemon/openapi_test.go holds it
# to the mux: every route in routes() is a path here with the same roles, every path
# here is a route, and every example decodes into the internal/api type it names
# (x-anam-type). docs/API.md is the prose; this file is the shapes.
info:
  title: Anam
  version: v1
  summary: One person's longitudinal record, read whole and written through a gate.
  description: >-
    Every route but /healthz and this document takes a token: a bearer token, or the
    same token as a basic-auth password so a browser can open the inspector. A token
    names a principal with a role (reader, importer or operator), and each operation
    says which roles open it (x-anam-roles). 401 is no token or an unknown one, 403 a
    role the route does not admit. Every error body is an Error. A request may carry
    Anam-Timeout, its own deadline, and the daemon works to the shorter of that and
    its configured timeout.
servers:
  - url: http://127.0.0.1:8787
    description: the default listen address; a token file is required to listen beyond loopback
security:
  - bearer: []
  - basic: []
tags:
  - name: record
    description: What the record holds and when.
  - name: receipts
    description: Reads filed with proof of what they served.
  - name: catalogue
    description: Definitions, projections and checkpoints.
  - name: submit
    description: How facts, Definitions and documents arrive, an importer's alone.
  - name: operate
    description: Minting and backups, the operator's alone.
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [operate]
      security: []
      x-anam-roles: []
      summary: Whether the daemon can read its ledger.
      responses:
        "200":
          description: ready
          content:
            text/plain:
              schema: { type: string, const: "ready\n" }
        "503":
          description: the ledger's head could not be read within the timeout
          content:
            text/plain:
              schema: { type: string }
  /v1/openapi.yaml:
    get:
      operationId: openapi
      tags: [operate]
      security: []
      x-anam-roles: []
      summary: This document, as the running build carries it.
      responses:
        "200":
          description: the specification
          content:
            application/yaml:
              schema: { type: string }
  /v1/status:
    get:
      operationId: getStatus
      tags: [record]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: Status
      summary: The record's state and what the daemon has seen of each source.
      parameters: [{ $ref: "#/components/parameters/AnamTimeout" }]
      responses:
        "200":
          description: the state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
              example:
                version: v0.336-265c26c
                person: matt
                ledger_id: 0d1e2f3a-4b5c-5d6e-8f90-a1b2c3d4e5f6
                w: 33378
                since: "2026-10-18T19:00:12.000000000Z"
                sources:
                  - source: garmin
                    last_scan_at: "2026-10-19T05:02:41.000000000Z"
                    last_admission_at: "2026-10-19T05:02:41.000000000Z"
                  - source: withings
                    last_scan_at: "2026-10-19T04:10:03.000000000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/LedgerUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/timeline:
    get:
      operationId: getTimeline
      tags: [record]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: Timeline
      summary: The whole-person read, narrowed as asked.
      description: >-
        Live facets in fact-time order. from and to narrow by fact time, at takes the
        snapshot (the latest of each series at or before it), as_of or w winds Anam's
        clock back, type keeps one type, projection prunes through a template, explain
        shows every version with its verdict, and fields cuts the payload to named
        pointers and answers with a frame. The answer is bounded by max_read_bytes;
        over it, 413 says what is left to narrow by.
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/At" }
        - { $ref: "#/components/parameters/AsOf" }
        - { $ref: "#/components/parameters/W" }
        - { $ref: "#/components/parameters/Type" }
        - { $ref: "#/components/parameters/Projection" }
        - { $ref: "#/components/parameters/Explain" }
        - { $ref: "#/components/parameters/Fields" }
        - { $ref: "#/components/parameters/Zone" }
        - { $ref: "#/components/parameters/AnamTimeout" }
      responses:
        "200":
          description: the read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timeline" }
              example:
                w: 33378
                live: 14609
                shown: 1
                canonical: sha256:1976fb0a4cfc1313ce243c81ae29b34671610d8c3898da3dab3a40a67d737d02
                entries:
                  - facet_id: 923f857a-84a2-5284-9d4a-b73e6d0a16c4
                    type: health.sleep-episode
                    fact_time: "2026-10-18T07:44:00.000000000Z"
                    source: garmin
                    source_ref: garmin:16:sleep:2026-10-18
                    status: admitted
                    classification: Sensitive
                    content_hash: sha256:ec002e673b06e5688a000c8b8a345759cb68b93b01edbea62ca04d65adbc1705
                    payload: { id: "sleep:2026-10-18", total_sleep_time: { unit: min, value: 555 } }
                versions: { 923f857a-84a2-5284-9d4a-b73e6d0a16c4: 1 }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/changes:
    get:
      operationId: getChanges
      tags: [record]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: Changes
      summary: What Anam learned between two anam-times.
      parameters:
        - name: since
          in: query
          required: true
          schema: { type: string }
          description: an anam-time, RFC 3339 or a bare date in zone
        - name: until
          in: query
          schema: { type: string }
          description: an anam-time; empty means now
        - { $ref: "#/components/parameters/Zone" }
        - { $ref: "#/components/parameters/AnamTimeout" }
      responses:
        "200":
          description: the anam-events in the window, from the operational store's index
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Changes" }
              example:
                index_seq: 33378
                w: 33378
                since: "2026-10-19T00:00:00.000000000Z"
                changes:
                  - seq: 33377
                    anam_time: "2026-10-19T04:10:03.000000000Z"
                    kind: superseded
                    facet_id: 2c6d1f5e-8a1b-5c2d-9e3f-4a5b6c7d8e9f
                    artifact_version: 2
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/IndexWrong" }
        "503": { $ref: "#/components/responses/LedgerUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/coverage:
    get:
      operationId: getCoverage
      tags: [record]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: Coverage
      summary: What the record holds, type by type, at a watermark.
      description: >-
        For each type in the value at the head, or at as_of or w: how many live facets,
        the earliest and latest fact-time among them, and each source's share. With
        projection it counts what that template serves. It is counted from the same
        value the timeline reads, so the same W gives the same answer, and canonical
        (or the projection's hash) names it. Coverage says what is recorded, never that
        a source is complete: freshness is GET /v1/status's, and a gap in fact-time may
        be a gap in the world. A read with no checkpoint to start from folds the whole
        ledger within the timeout, or answers 504.
      parameters:
        - { $ref: "#/components/parameters/AsOf" }
        - { $ref: "#/components/parameters/W" }
        - { $ref: "#/components/parameters/Projection" }
        - { $ref: "#/components/parameters/Zone" }
        - { $ref: "#/components/parameters/AnamTimeout" }
      responses:
        "200":
          description: the coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coverage" }
              example:
                w: 33378
                ledger_id: 6f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f
                live: 14609
                canonical: sha256:1976fb0a4cfc1313ce243c81ae29b34671610d8c3898da3dab3a40a67d737d02
                types:
                  - type: health.blood-pressure
                    count: 1204
                    earliest: "2019-03-02T21:10:00.000000000Z"
                    latest: "2026-10-18T20:31:00.000000000Z"
                    sources:
                      - { source: bp-csv, count: 1180, earliest: "2019-03-02T21:10:00.000000000Z", latest: "2026-02-10T18:04:00.000000000Z" }
                      - { source: garmin, count: 24, earliest: "2026-02-14T19:40:00.000000000Z", latest: "2026-10-18T20:31:00.000000000Z" }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/receipts:
    get:
      operationId: getReceipts
      tags: [receipts]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: Receipts
      summary: The receipts of past serves, newest first.
      responses:
        "200":
          description: the receipts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipts" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: postReceipt
      tags: [receipts]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: Published
      summary: Publish a read, filed with a receipt.
      description: >-
        The timeline read the query describes, through the projection it names, filed
        as an artifact with a receipt that names exactly the entries served at W.
        Writes artifacts only, never the ledger. The parameters are the timeline's;
        projection is required. A read too large for one answer is filed once, whole,
        and answered a page at a time (card 92): entries (or the frame's rows) and
        versions are the first page, shown is the whole count, and page.next_cursor
        reads the next page from GET /v1/receipts/{hash}. 413 only when one facet
        alone is over max_read_bytes, which no page can carry; nothing is filed.
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/At" }
        - { $ref: "#/components/parameters/AsOf" }
        - { $ref: "#/components/parameters/W" }
        - { $ref: "#/components/parameters/Type" }
        - name: projection
          in: query
          required: true
          schema: { type: string }
          description: the template that prunes the read
        - { $ref: "#/components/parameters/Explain" }
        - { $ref: "#/components/parameters/Fields" }
        - { $ref: "#/components/parameters/Zone" }
        - { $ref: "#/components/parameters/AnamTimeout" }
      responses:
        "201":
          description: the read's first page, with its receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Published" }
              example:
                w: 33378
                live: 14609
                shown: 2
                canonical: sha256:1976fb0a4cfc1313ce243c81ae29b34671610d8c3898da3dab3a40a67d737d02
                projection: { name: bp, version: 1, served: 2, hash: sha256:1976fb0a4cfc1313ce243c81ae29b34671610d8c3898da3dab3a40a67d737d02 }
                entries:
                  - facet_id: 923f857a-84a2-5284-9d4a-b73e6d0a16c4
                    type: health.blood-pressure
                    fact_time: "2026-10-18T07:44:00.000000000Z"
                    source: bp-csv
                    source_ref: bp-csv:2026-10-18T07:44
                    status: admitted
                    classification: Sensitive
                    content_hash: sha256:ec002e673b06e5688a000c8b8a345759cb68b93b01edbea62ca04d65adbc1705
                    payload: { id: "bp:2026-10-18T07:44", systolic: 128, diastolic: 82 }
                versions: { 923f857a-84a2-5284-9d4a-b73e6d0a16c4: 1 }
                receipt_hash: sha256:5d0c3a7e9b1f42d8a6c3e0b7f19d2a4c8e6b0f3a5d7c9e1b2a4f6d8c0e2b4a6c
                receipt:
                  served_hash: sha256:1976fb0a4cfc1313ce243c81ae29b34671610d8c3898da3dab3a40a67d737d02
                  facet_ids: [923f857a-84a2-5284-9d4a-b73e6d0a16c4, b81e3f2a-6c4d-5e7f-8a9b-0c1d2e3f4a5b]
                  watermark: 33378
                  template: bp
                  template_version: 1
                  template_hash: sha256:7a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
                  definition_set_version: sha256:ec002e673b06e5688a000c8b8a345759cb68b93b01edbea62ca04d65adbc1705
                  served_at: "2026-10-21T09:00:00.000000000Z"
                  span: all
                  ledger_id: 4b1f7c2e-8d3a-4f6b-9c1e-2a7d5e8f0b3c
                page: { offset: 0, returned_count: 1, total_count: 2, next_cursor: eyJ2IjoxLCJyZWNlaXB0Ijoic2hhMjU2OjVkMGMzYTdlOWIxZjQyZDhhNmMzZTBiN2YxOWQyYTRjOGU2YjBmM2E1ZDdjOWUxYjJhNGY2ZDhjMGUyYjRhNmMiLCJvZmZzZXQiOjEsImZhY2V0X2lkIjoiYjgxZTNmMmEtNmM0ZC01ZTdmLThhOWItMGMxZDJlM2Y0YTViIn0 }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: the projection is not registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/CannotHonour" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/receipts/{hash}:
    get:
      operationId: getReceipt
      tags: [receipts]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: ReceiptShown
      summary: A receipt and the value it served, a page at a time, from the artifacts alone.
      description: >-
        Without a cursor, the receipt and the first page of its value; with one, the
        page it names, carrying hash and page but not the receipt again (card 92).
        Every page is whole facets cut to max_read_bytes from the served artifact the
        receipt hashes, never a new read, so walking next_cursor to the end gives back
        exactly the receipt's facet_ids in order. A frame pages by rows, every page
        with all the columns. A query receipt's answer is one relation and is not
        paged. A page whose first facet is over the bound alone is 413 naming it, with
        the cursor past it; open the facet at /v1/receipts/{hash}/facets/{facet_id}.
      parameters:
        - { $ref: "#/components/parameters/ReceiptHash" }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: >-
            a next_cursor this receipt issued; opaque. Checked against the receipt, so
            another receipt's cursor, a changed offset or anything else is 400
            cursor_invalid
      responses:
        "200":
          description: the receipt and a page of its entries, or of its frame; or its answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptShown" }
              example:
                hash: sha256:5d0c3a7e9b1f42d8a6c3e0b7f19d2a4c8e6b0f3a5d7c9e1b2a4f6d8c0e2b4a6c
                entries:
                  - facet_id: b81e3f2a-6c4d-5e7f-8a9b-0c1d2e3f4a5b
                    type: health.blood-pressure
                    fact_time: "2026-10-19T07:40:00.000000000Z"
                    source: bp-csv
                    source_ref: bp-csv:2026-10-19T07:40
                    status: admitted
                    classification: Sensitive
                    content_hash: sha256:0a4cfc1313ce243c81ae29b34671610d8c3898da3dab3a40a67d737d021976fb
                    payload: { id: "bp:2026-10-19T07:40", systolic: 131, diastolic: 84 }
                page: { offset: 1, returned_count: 1, total_count: 2 }
        "400":
          description: a cursor this receipt did not issue (code cursor_invalid), or a hash that is not one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: "cursor invalid: offset 3 is outside the receipt's 2 facets"
                code: cursor_invalid
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NoArtifact" }
        "413": { $ref: "#/components/responses/TooLarge" }
  /v1/receipts/{hash}/verify:
    get:
      operationId: verifyReceipt
      tags: [receipts]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: ReceiptVerified
      summary: Re-derive a receipt from the ledger and re-hash its file.
      parameters:
        - { $ref: "#/components/parameters/ReceiptHash" }
        - { $ref: "#/components/parameters/AnamTimeout" }
      responses:
        "200":
          description: both proofs, each reported on its own
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptVerified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NoArtifact" }
        "409": { $ref: "#/components/responses/CannotHonour" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/receipts/{hash}/facets/{facet_id}:
    get:
      operationId: getReceiptFacet
      tags: [receipts]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: FacetShown
      summary: One facet as the receipt served it, with the links the record holds to it.
      description: >-
        The entry is the receipt's served value (card 91): the payload and envelope as
        admitted, which its content hash covers, at the receipt's W. Beside it, links
        (card 104): the live edge facets that name this facet on either side, read from
        the edge index at the index's own watermark w, never written into the facet. A
        facet the receipt did not serve is 404, since a facet id alone opens nothing a
        projection did not serve; a receipt that served a frame or a query answer has no
        entries to open, also 404. A wrong index refuses the whole answer.
      parameters:
        - { $ref: "#/components/parameters/ReceiptHash" }
        - { $ref: "#/components/parameters/FacetID" }
        - { $ref: "#/components/parameters/AnamTimeout" }
      responses:
        "200":
          description: the entry and its links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacetShown" }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NoArtifact" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/query:
    get:
      operationId: getQueryCatalogue
      tags: [record]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: QueryCatalogue
      summary: What a query can be written against.
      description: >-
        The introspection an agent reads before writing a Datalog program (card 173):
        the base relations and the instant parameter, the exact fact-time lexeme, every
        type's payload pointers at every Definition version held, and the bundled rule
        set with its hash, its text and the relations it defines. Reads no facet.
      parameters:
        - { $ref: "#/components/parameters/AnamTimeout" }
      responses:
        "200":
          description: the catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryCatalogue" }
              example:
                syntax: "A program is rules, facts and declarations, each ending in a period; % starts a comment."
                relations:
                  - { name: entry, arity: 7, args: [E, Type, FactTime, Series, Status, Source, DefinitionVersion], kind: base, doc: one served facet's envelope }
                  - { name: instant, arity: 1, args: [At], kind: parameter, doc: the fact-times a query asks about }
                instant: { layout: "2006-01-02T15:04:05.000000000Z07:00", example: "2026-06-15T00:00:00.000000000Z" }
                types:
                  - type: health.medication-started
                    current: 5
                    series: med.regimen
                    closes: false
                    versions:
                      - { version: 4, pointers: [/course, /date, /drug, /id] }
                      - { version: 5, pointers: [/as_dispensed, /course, /date, /dispensed_at, /dose, /drug, /id, /prescribed_by, /source_note] }
                rules:
                  name: anam
                  version: 1
                  hash: sha256:1976fb0a4cfc1313ce243c81ae29b34671610d8c3898da3dab3a40a67d737d02
                  text: "instant/1.\ncurrent(E, At) :- before(E, At), not displaced(E, At), not closed(E, At).\n"
                  relations:
                    - { name: current, arity: 2, args: [E, At], kind: rule, doc: the last-known value at At }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/Timeout" }
    post:
      operationId: postQuery
      tags: [record]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: QueryAnswer
      summary: Run a Datalog program through a projection, answered with a receipt.
      description: >-
        The third read (ARCHITECTURE.md §9, card 173). The program runs over what the
        named projection serves at the head, or at as_of or w, built on the bundled
        rules; the named relation is the answer, a sorted relation that hashes. The
        answer is filed with a receipt naming the projection, the rule set and the
        program unless dry_run is set, so the same query at the same W reproduces it.
        A program that cannot run is refused with 400 and a message saying what to
        change; a derivation or an answer over max_read_bytes is 413, with instant,
        projection and program as the narrowings. Writes artifacts only, never the
        ledger, and moves no watermark.
      parameters:
        - { $ref: "#/components/parameters/AnamTimeout" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryRequest" }
            example:
              projection: everything
              text: "instant(At) :- entry(_, \"health.blood-pressure\", At, _, _, _, _).\nregimen(At, Drug) :- entry(_, \"health.blood-pressure\", At, _, _, _, _), current(E, At), entry(E, \"health.medication-started\", _, _, _, _, _), attr(E, \"/drug\", Drug)."
              relation: regimen
      responses:
        "200":
          description: the answer, derived and not filed (dry_run)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryAnswer" }
        "201":
          description: the answer, filed with its receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryAnswer" }
              example:
                w: 33378
                ledger_id: 4b1f7c2e-8d3a-4f6b-9c1e-2a7d5e8f0b3c
                live: 14609
                canonical: sha256:1976fb0a4cfc1313ce243c81ae29b34671610d8c3898da3dab3a40a67d737d02
                projection: { name: everything, version: 1, served: 14609, hash: sha256:1976fb0a4cfc1313ce243c81ae29b34671610d8c3898da3dab3a40a67d737d02 }
                definition_set_version: sha256:ec002e673b06e5688a000c8b8a345759cb68b93b01edbea62ca04d65adbc1705
