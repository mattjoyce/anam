  /v1/checkpoints:
    get:
      operationId: getCheckpoints
      tags: [catalogue]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: Checkpoints
      summary: Every checkpoint ever minted, by bucket and version.
      parameters: [{ $ref: "#/components/parameters/AnamTimeout" }]
      responses:
        "200":
          description: the checkpoint log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkpoints" }
              example:
                db: /data/tracking.db
                checkpoints:
                  - span_id: "2026-10"
                    v: 12
                    covers_w: 33378
                    value_hash: sha256:0c1d2e3f405162738495a6b7c8d9e0f10a2b3c4d5e6f708192a3b4c5d6e7f809
                    minted_at: "2026-10-19T05:03:00.000000000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/IndexWrong" }
        "504": { $ref: "#/components/responses/Timeout" }
    post:
      operationId: postCheckpoints
      tags: [operate]
      x-anam-roles: [operator]
      x-anam-type: Mint
      summary: Mint every bucket whose value moved.
      description: >-
        Runs on the write queue; while another write holds it, 503 at once. dry_run
        derives and publishes nothing; full folds the whole ledger instead of starting
        from the last run.
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
        - name: full
          in: query
          schema: { type: boolean, default: false }
        - { $ref: "#/components/parameters/AnamTimeout" }
      responses:
        "200":
          description: what happened to each bucket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mint" }
              example:
                w: 33378
                written: true
                full: false
                from: 33201
                outcomes:
                  - { span_id: "2026-10", v: 12, covers_w: 33378, value_hash: sha256:0c1d2e3f405162738495a6b7c8d9e0f10a2b3c4d5e6f708192a3b4c5d6e7f809, len: 1821, minted: true }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Busy" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/definitions:
    get:
      operationId: getDefinitions
      tags: [catalogue]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: Definitions
      summary: Every type the daemon admits, with its current version and every version held.
      parameters: [{ $ref: "#/components/parameters/AnamTimeout" }]
      responses:
        "200":
          description: the types
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Definitions" }
              example:
                definitions:
                  - { type: health.weight, origin: bundled, current: 3, versions: [1, 2, 3] }
                  - { type: health.sleep-episode, origin: registered, current: 1, versions: [1] }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: postDefinitions
      tags: [submit]
      x-anam-roles: [importer]
      x-anam-type: Registered
      summary: Register a Definition for a type the importer owns.
      description: >-
        201 a new version, 200 the same body again at a held version, 403 a type the
        importer does not own (one of its types; an any_type importer owns none), 409
        another body at a held version, a bundled type, or a version behind, 422 a bad
        manifest.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefinitionManifest" }
      responses:
        "200":
          description: already held, unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registered" }
        "201":
          description: registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registered" }
              example: { type: health.sleep-episode, version: 2, new: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Immutable" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422": { $ref: "#/components/responses/BadManifest" }
        "503": { $ref: "#/components/responses/Busy" }
  /v1/definitions/{type}:
    get:
      operationId: getDefinitionCurrent
      tags: [catalogue]
      x-anam-roles: [reader, importer, operator]
      summary: A type's Definition at its current version, as published.
      parameters:
        - { $ref: "#/components/parameters/FacetType" }
        - { $ref: "#/components/parameters/AnamTimeout" }
      responses:
        "200":
          description: the manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefinitionManifest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/definitions/{type}/{version}:
    get:
      operationId: getDefinitionVersion
      tags: [catalogue]
      x-anam-roles: [reader, importer, operator]
      summary: A type's Definition at one version, as it was in force.
      parameters:
        - { $ref: "#/components/parameters/FacetType" }
        - { $ref: "#/components/parameters/Version" }
        - { $ref: "#/components/parameters/AnamTimeout" }
      responses:
        "200":
          description: the manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefinitionManifest" }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/snapshots/{id}:
    get:
      operationId: getSnapshot
      tags: [submit]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: SnapshotReport
      summary: How far a complete resend has got, and what it left absent once complete.
      description: >-
        An importer sees only its own source's runs; another source's is 404 to it.
        Nothing is tombstoned by a snapshot; absence is reported.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        - { $ref: "#/components/parameters/AnamTimeout" }
      responses:
        "200":
          description: the report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotReport" }
              example:
                id: garmin:2026-10-19T05
                parts: 3
                parts_admitted: 3
                complete: true
                source: garmin
                types: [health.sleep-episode]
                carried: 1317
                started_at: "2026-10-19T05:02:00.000000000Z"
                started_w: 33370
                completed_at: "2026-10-19T05:02:41.000000000Z"
                completed_w: 33378
                live: 1317
                absent: 0
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: more facets to judge absent than max_absent_judged allows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/envelopes:
    post:
      operationId: postEnvelopes
      tags: [submit]
      x-anam-roles: [importer]
      x-anam-type: Admission
      summary: Submit one batch of facts, admitted whole or not at all.
      description: >-
        The token's principal is the source of every envelope and may submit only its
        types (or any type, with any_type). The gate checks each envelope against its
        Definition; one failure refuses the batch and nothing is written (422, with
        every refused envelope named). Admission is idempotent: the same content again
        is a no-op, changed content under the same identity supersedes. At most
        gate.MaxBatch envelopes. A batch may be one part of a complete resend
        (snapshot). While another write holds the queue past importer_wait, 503 with
        Retry-After.
      parameters: [{ $ref: "#/components/parameters/AnamTimeout" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Submission" }
            example:
              envelopes:
                - type: health.weight
                  definition_version: 3
                  payload: { id: "conversation:weight/2026-10-19", date: "2026-10-19 07:30", kg: 80.5 }
                  asserted_person: matt
      responses:
        "200":
          description: admitted; an outcome for every envelope and W after
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
              example:
                w: 33379
                changed: 1
                results:
                  - { index: 0, outcome: admitted, facet_id: 5e6f7081-92a3-5b4c-8d5e-6f708192a3b4, artifact_version: 1 }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: a snapshot part that does not belong to the run its id names
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422":
          description: refused whole; every failing envelope and why
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refusal" }
              example:
                error: "envelope 0: not compliant: /kg: expected number, got string"
                refused:
                  - { index: 0, type: health.weight, reason: "not compliant: /kg: expected number, got string" }
        "503": { $ref: "#/components/responses/Busy" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/documents:
    post:
      operationId: postDocument
      tags: [submit]
      x-anam-roles: [importer]
      x-anam-type: StoredDocument
      summary: Hand Anam a document's bytes; the answer is the sha256 a record.document names.
      description: >-
        Only a principal that lists record.document among its types may store documents.
        The same bytes again are unchanged (200); other bytes are another file (201).
        Bounded by max_document_bytes.
      parameters:
        - name: ext
          in: query
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9]{1,16}$" }
          description: the file's extension, which names its media type
        - { $ref: "#/components/parameters/AnamTimeout" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: already held
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredDocument" }
        "201":
          description: stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredDocument" }
              example: { sha256: 3b5d5c3712955042212316173ccf37be6a3d6a1a4a5a2a4e6e6c2e0f1b2c3d4e, bytes: 48213, media_type: application/pdf, new: true }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "503": { $ref: "#/components/responses/Busy" }
  /v1/backups:
    post:
      operationId: postBackups
      tags: [operate]
      x-anam-roles: [operator]
      x-anam-type: Backup
      summary: Copy the record into backup_dir, holding the write queue while it copies.
      responses:
        "200":
          description: the backup taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
              example: { path: /backups/anam-20261019T050300Z, w: 33378, bytes: 73400320, files: 41, pruned: [/backups/anam-20261005T050300Z] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: no backup_dir configured, or the daemon is stopping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/facets/{id}/retract:
    post:
      operationId: postFacetRetract
      tags: [operate]
      x-anam-roles: [operator]
      x-anam-type: Retraction
      summary: Tombstone one facet of a source nobody resends, by hand.
      description: >-
        The body names the source the facet must belong to. The plan is the one
        `anam retract <source> --facet` applies, made inside the write: 409 for a facet
        of another source, a facet that is not live, or a source an importer declares
        and has completed a snapshot for (its next resend reconciles it); 404 for a
        facet the ledger does not hold. The artifact stays, and a read as of before the
        tombstone still shows the facet. A request from a browser on another site is 403.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/AnamTimeout" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetractRequest" }
            example: { source: workbench }
      responses:
        "200":
          description: the tombstone, or a no-op when another writer got there first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retraction" }
              example: { facet_id: 7f3a9c1e5d2b4a68, source: workbench, type: health.medication-dose, artifact_version: 1, outcome: tombstoned, seq: 33379, w: 33379 }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: the facet is of another source, is not live, or its source is reconciled by an importer's snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Busy" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/entry:
    post:
      operationId: postEntry
      tags: [operate]
      x-anam-roles: [operator]
      x-anam-type: Entry
      summary: Enter one fact by hand, as the workbench source.
      description: >-
        The Workbench's write (card 188). The operator's token opens it, and the daemon
        submits the one envelope as the workbench principal the importers file declares
        (`source: workbench`, no token, `types` its allow-list): no importer token
        reaches a browser. It is a route over the same write as POST /v1/envelopes, so
        the gate holds the entry to the workbench's types as it holds an importer, and
        the write queue, index catch-up, status and mint are the same. The body names
        no source, injector or id: the gate fills the identity field from the
        Definition's identity_template, or refuses a payload that lacks the field when
        the type declares none. 404 when the importers file declares no workbench
        principal; 409 when definition_version is not the type's version in force;
        422 when the gate refuses (a type outside the workbench's types, a payload the
        Definition refuses, an id that disagrees with the rule), with its words
        verbatim; 503 with Retry-After while another write holds the queue. A request
        from a browser on another site is 403.
      parameters: [{ $ref: "#/components/parameters/AnamTimeout" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryRequest" }
            example:
              type: health.medication-dose
              definition_version: 2
              payload: { drug: melatonin, amount: 5, unit: mg, taken_at: "2026-10-19 22:00", reason: to help sleep }
      responses:
        "200":
          description: admitted, superseded (a new version of a facet already held), or a no-op (the same facet, unchanged, with its id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
              example: { outcome: admitted, facet_id: 4b0ec770-9f8f-555f-a680-378d02ae6ede, artifact_version: 1, seq: 33380, w: 33380 }
        "400": { $ref: "#/components/responses/BadQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: the importers file declares no workbench principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: definition_version is not the type's version in force; the gate's words, in the refusal's shape
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refusal" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422":
          description: refused, nothing written; the gate's reason for the entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refusal" }
              example:
                error: "batch refused, nothing admitted: envelope 0 (health.medication-dose): def: payload not compliant: /amount: expected number, got string"
                refused:
                  - { index: 0, type: health.medication-dose, reason: "def: payload not compliant: /amount: expected number, got string" }
        "503": { $ref: "#/components/responses/Busy" }
        "504": { $ref: "#/components/responses/Timeout" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <token>; the token names a principal in the importers file, or the operator's token_file"
    basic:
      type: http
      scheme: basic
      description: the same token as the password, any user name; for a browser opening the inspector
  parameters:
    AnamTimeout:
      name: Anam-Timeout
      in: header
      schema: { type: string, example: 4s }
      description: the caller's own deadline, a Go duration; the daemon works to the shorter of it and its timeout
    Zone:
      name: zone
      in: query
      schema: { type: string, example: Australia/Sydney }
      description: the reader's zone, an IANA name; a bare date is a day in it. Local is refused
    From:
      name: from
      in: query
      schema: { type: string }
      description: fact-time lower bound, inclusive; RFC 3339 or a bare date in zone
    To:
      name: to
      in: query
      schema: { type: string }
      description: fact-time upper bound, exclusive; excluded by at
    At:
      name: at
      in: query
      schema: { type: string }
      description: the snapshot at this fact-time, the latest of each series at or before it
    AsOf:
      name: as_of
      in: query
      schema: { type: string }
      description: read what Anam knew at this anam-time
    W:
      name: w
      in: query
      schema: { type: integer, format: int64 }
      description: read at this watermark instead of an anam-time; the W a receipt names
    Type:
      name: type
      in: query
      schema: { type: string, example: health.blood-pressure }
      description: keep one facet type
    Projection:
      name: projection
      in: query
      schema: { type: string }
      description: prune through this template; the served hash is the one a receipt would record
    Explain:
      name: explain
      in: query
      schema: { type: boolean, default: false }
      description: every version with its verdict, in place of the entries
    Fields:
      name: fields
      in: query
      style: form
      explode: true
      schema: { type: array, items: { type: string, example: /kg } }
      description: payload fields wanted, as JSON pointers into the type's schema; the answer is then a frame
    ReceiptHash:
      name: hash
      in: path
      required: true
      schema: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
    FacetID:
      name: facet_id
      in: path
      required: true
      schema: { type: string }
    ProjectionName:
      name: name
      in: path
      required: true
      schema: { type: string }
    FacetType:
      name: type
      in: path
      required: true
      schema: { type: string, example: health.weight }
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: no token, or one the daemon does not know
      headers:
        WWW-Authenticate:
          schema: { type: string, const: 'Basic realm="anam"' }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unauthorized }
    Forbidden:
      description: the token's role does not open this route, or the importer does not own the type
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadQuery:
      description: a parameter, path value or body that cannot be read as asked
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: nothing by that name or version
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoArtifact:
      description: no receipt filed under that hash
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CannotHonour:
      description: the receipt names a template version that moved, or another ledger
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Immutable:
      description: another body at a held version, a version behind the current, or a bundled type
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadManifest:
      description: the manifest does not parse as one, or names a type with no Definition
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BodyTooLarge:
      description: the body is over its bound (max_manifest_bytes, max_document_bytes, or a batch of max_payload_bytes payloads)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: >-
        the answer is over max_read_bytes; the body measures it and names what is left
        to narrow by. A published read pages instead, so there it is one facet over
        the bound alone, named in too_large.facet_id
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: "the answer is 1203411 bytes against a bound of 524288"
            code: result_too_large
            too_large: { matched: 14609, bytes: 524288, max_bytes: 524288, narrow: [from, type, projection] }
    Busy:
      description: another write holds the queue past the wait, or the daemon is stopping
      headers:
        Retry-After:
          schema: { type: integer }
          description: whole seconds (retry_after)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IndexWrong:
      description: the operational store's index was built from another ledger or is ahead of this one; restart the daemon on a sound one
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LedgerUnavailable:
      description: the ledger could not be read
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Timeout:
      description: the request ran out of time, the shorter of Anam-Timeout and the daemon's timeout
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: what went wrong, in words }
        code: { type: string, enum: [result_too_large, cursor_invalid], description: a name for a program, when there is one }
        too_large: { $ref: "#/components/schemas/TooLarge" }
    TooLarge:
      type: object
      required: [matched, bytes, max_bytes]
      properties:
        matched: { type: integer }
        bytes: { type: integer, description: what the entries encode to, counted up to the bound }
        max_bytes: { type: integer }
        narrow: { type: array, items: { type: string }, description: query parameters not yet used }
        facet_id: { type: string, description: the one facet over the bound alone, when a published read is refused for it (card 92) }
        next_cursor: { type: string, description: on a page refused for its first facet, the page after it }
    Page:
      type: object
      description: >-
        which portion of a receipted value an answer carries (card 92): the receipt's
        facets from offset, returned_count of them, of total_count; next_cursor reads
        the next page, absent on the last
      required: [offset, returned_count, total_count]
      properties:
        offset: { type: integer }
        returned_count: { type: integer }
        total_count: { type: integer }
        next_cursor: { type: string }
    Status:
      type: object
      required: [version, person, ledger_id, w, sources]
      properties:
        version: { type: string }
        person: { type: string }
        ledger_id: { type: string, format: uuid }
        w: { type: integer, format: int64, description: the watermark, the newest anam-event's seq }
        since: { type: string, description: when the daemon started }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceStatus" }
    SourceStatus:
      type: object
      required: [source, last_scan_at]
      properties:
        source: { type: string }
        last_scan_at: { type: string, description: when the source's last batch arrived }
        last_admission_at: { type: string, description: when its last batch that changed anything arrived }
    AnamTime:
      type: string
      description: a fixed-width UTC instant, 2006-01-02T15:04:05.000000000Z
      example: "2026-10-19T05:02:41.000000000Z"
    Entry:
      type: object
      description: one live facet as the fold presents it
      required: [facet_id, type, fact_time, source, source_ref, status, classification, content_hash, payload]
      properties:
        facet_id: { type: string, format: uuid }
        type: { type: string }
        fact_time: { $ref: "#/components/schemas/AnamTime" }
        series: { type: string, description: the Definition's series stamp, when the type has one }
        source: { type: string }
        source_ref: { type: string }
        status: { type: string, enum: [admitted, endorsed, superseded, tombstoned] }
        classification: { type: string }
        content_hash: { type: string }
        payload: { description: the facet's payload, verbatim }
    Frame:
      type: object
      description: entries cut to named fields, as columns and rows
      required: [columns, rows]
      properties:
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array, items: {} } }
    ProjectionRead:
      type: object
      required: [name, version, served, hash]
      properties:
        name: { type: string }
        version: { type: integer }
        served: { type: integer, description: facets the projection served before any narrowing }
        hash: { type: string }
    VerdictRow:
      type: object
      required: [fact_time, type, version, standing, source_ref, facet_id]
      properties:
        fact_time: { $ref: "#/components/schemas/AnamTime" }
        type: { type: string }
        version: { type: integer }
        standing: { type: string, enum: [served, excluded, superseded] }
        reason: { type: string }
        source_ref: { type: string }
        facet_id: { type: string, format: uuid }
    VerdictCounts:
      type: object
      properties:
        served: { type: integer }
        excluded: { type: integer }
        superseded: { type: integer }
    Timeline:
      type: object
      required: [w, live, shown, canonical]
      properties:
        w: { type: integer, format: int64 }
        live: { type: integer }
        shown: { type: integer }
        as_of: { $ref: "#/components/schemas/AnamTime" }
        at: { $ref: "#/components/schemas/AnamTime" }
        at_hash: { type: string }
        canonical: { type: string, description: the whole-person value's hash at W, whatever the narrowing }
        projection: { $ref: "#/components/schemas/ProjectionRead" }
        entries: { type: array, items: { $ref: "#/components/schemas/Entry" } }
        versions: { type: object, additionalProperties: { type: integer }, description: each shown entry's artifact version, by facet id }
        frame: { $ref: "#/components/schemas/Frame" }
        verdicts: { type: array, items: { $ref: "#/components/schemas/VerdictRow" } }
        counts: { $ref: "#/components/schemas/VerdictCounts" }
    Coverage:
      type: object
      description: what is recorded at w, never that a source is complete
      required: [w, ledger_id, live, canonical, types]
      properties:
        w: { type: integer, format: int64 }
        ledger_id: { type: string, format: uuid }
        live: { type: integer, description: facets counted, the whole person's or what the projection served }
        canonical: { type: string, description: the whole-person value's hash at w }
        projection: { $ref: "#/components/schemas/ProjectionRead" }
        types: { type: array, items: { $ref: "#/components/schemas/TypeCoverage" } }
    TypeCoverage:
      type: object
      required: [type, count, earliest, latest, sources]
      properties:
        type: { type: string }
        count: { type: integer }
        earliest: { $ref: "#/components/schemas/AnamTime" }
        latest: { $ref: "#/components/schemas/AnamTime" }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceCoverage" } }
    SourceCoverage:
      type: object
      required: [source, count, earliest, latest]
      properties:
        source: { type: string }
        count: { type: integer }
        earliest: { $ref: "#/components/schemas/AnamTime" }
        latest: { $ref: "#/components/schemas/AnamTime" }
    Changes:
      type: object
      required: [index_seq, w, since, changes]
      properties:
        index_seq: { type: integer, format: int64, description: the last anam-event the index holds; below w, the index is behind }
        w: { type: integer, format: int64 }
        since: { $ref: "#/components/schemas/AnamTime" }
        until: { $ref: "#/components/schemas/AnamTime" }
        changes: { type: array, items: { $ref: "#/components/schemas/Change" } }
    Change:
      type: object
      required: [seq, anam_time, kind, facet_id, artifact_version]
      properties:
        seq: { type: integer, format: int64 }
        anam_time: { $ref: "#/components/schemas/AnamTime" }
        kind: { type: string, enum: [admitted, superseded, tombstoned] }
        facet_id: { type: string, format: uuid }
        artifact_version: { type: integer }
    Receipt:
      type: object
      required: [served_hash, facet_ids, watermark, template, template_version, definition_set_version, served_at, span]
      properties:
        served_hash: { type: string }
        facet_ids: { type: array, items: { type: string } }
        watermark: { type: integer, format: int64 }
        template: { type: string }
        template_version: { type: integer }
        definition_set_version: { type: string }
        served_at: { $ref: "#/components/schemas/AnamTime" }
        span: { type: string }
        ledger_id: { type: string }
        query: { $ref: "#/components/schemas/ReceiptQuery" }
        template_hash: { type: string }
        program: { $ref: "#/components/schemas/ReceiptProgram" }
    ReceiptProgram:
      type: object
      description: the query a receipt answers (card 173); the template is the projection it ran through
      required: [rule_set, rule_set_version, rule_set_hash, text, relation]
      properties:
        rule_set: { type: string }
        rule_set_version: { type: integer }
        rule_set_hash: { type: string }
        text: { type: string }
        relation: { type: string }
    ReceiptQuery:
      type: object
      description: how the read narrowed the template's value, resolved to instants
      properties:
        from: { $ref: "#/components/schemas/AnamTime" }
        before: { $ref: "#/components/schemas/AnamTime" }
        at: { $ref: "#/components/schemas/AnamTime" }
        type: { type: string }
        fields: { type: array, items: { type: string } }
    Receipts:
      type: object
      required: [dir, receipts]
      properties:
        dir: { type: string }
        receipts:
          type: array
          items:
            type: object
            required: [hash, receipt]
            properties:
              hash: { type: string }
              receipt: { $ref: "#/components/schemas/Receipt" }
    ReceiptShown:
      type: object
      required: [hash, entries]
      properties:
        hash: { type: string }
        receipt: { $ref: "#/components/schemas/Receipt", description: on the first page only }
        entries: { type: array, items: { $ref: "#/components/schemas/Entry" } }
        frame: { $ref: "#/components/schemas/Frame" }
        answer: { $ref: "#/components/schemas/Answer" }
        page: { $ref: "#/components/schemas/Page", description: absent for a query receipt's answer, which is not paged }
    FacetShown:
      type: object
      required: [hash, receipt, entry, links]
      properties:
        hash: { type: string }
        receipt: { $ref: "#/components/schemas/Receipt" }
        entry: { $ref: "#/components/schemas/Entry" }
        links: { $ref: "#/components/schemas/Links" }
    Links:
      type: object
      description: the live edges touching the facet, at the edge index's watermark w; edges is empty when none touch it
      required: [w, edges]
      properties:
        w: { type: integer, format: int64 }
        edges: { type: array, items: { $ref: "#/components/schemas/Link" } }
    Link:
      type: object
      description: one live edge facet (a record.note that joins facets) touching the facet shown
      required: [edge, kind, at, side, from, to]
      properties:
        edge: { type: string, description: the edge facet's id }
        kind: { type: string, description: what the join means, from the edge's Definition; about when the edge says none }
        at: { type: string, description: the edge's fact-time, when it was asserted }
        side: { type: string, enum: [from, to, both], description: which side the facet shown is on }
        from: { type: array, items: { type: string } }
        to: { type: array, items: { type: string } }
    Answer:
      type: object
      description: a query's answer, one relation's tuples sorted; a constant is a string, a number or a boolean
      required: [relation, tuples]
      properties:
        relation: { type: string }
        tuples: { type: array, items: { type: array, items: {} } }
    QueryRequest:
      type: object
      required: [projection, text, relation]
      properties:
        projection: { type: string, description: the template the query runs through }
        text: { type: string, description: the program, Anam's Datalog, built on the bundled rules }
        relation: { type: string, description: the derived relation answered }
        as_of: { type: string, description: read what Anam knew at this anam-time }
        w: { type: integer, format: int64, description: read at this watermark instead }
        dry_run: { type: boolean, description: derive the answer and its receipt, file nothing }
        zone: { type: string, description: the reader's zone, for a bare date in as_of }
    QueryAnswer:
      type: object
      required: [w, ledger_id, live, canonical, projection, definition_set_version, rules, answer, hash, receipt_hash, receipt, written]
      properties:
        w: { type: integer, format: int64 }
        ledger_id: { type: string }
        as_of: { $ref: "#/components/schemas/AnamTime" }
        live: { type: integer }
        canonical: { type: string }
        projection: { $ref: "#/components/schemas/ProjectionRead" }
        definition_set_version: { type: string }
        rules:
          type: object
          required: [name, version, hash]
          properties:
            name: { type: string }
            version: { type: integer }
            hash: { type: string }
        answer: { $ref: "#/components/schemas/Answer" }
        hash: { type: string, description: the answer's hash, the receipt's served_hash }
        warnings: { type: array, items: { type: string } }
        receipt_hash: { type: string }
        receipt: { $ref: "#/components/schemas/Receipt" }
        written: { type: boolean }
    QueryCatalogue:
      type: object
      required: [syntax, relations, instant, types, rules]
      properties:
        syntax: { type: string }
        relations:
          type: array
          items:
            type: object
            required: [name, arity, args, kind]
            properties:
              name: { type: string }
              arity: { type: integer }
              args: { type: array, items: { type: string } }
              kind: { type: string, enum: [base, parameter, rule] }
              doc: { type: string }
        instant:
          type: object
          required: [layout, example]
          properties:
            layout: { type: string }
            example: { type: string }
        types:
          type: array
          items:
            type: object
            required: [type, current, closes, versions]
            properties:
              type: { type: string }
              current: { type: integer }
              series: { type: string }
              closes: { type: boolean }
              versions:
                type: array
                items:
                  type: object
                  required: [version, pointers]
                  properties:
                    version: { type: integer }
                    pointers: { type: array, items: { type: string } }
        rules:
          type: object
          required: [name, version, hash, text, relations]
          properties:
            name: { type: string }
            version: { type: integer }
            hash: { type: string }
            text: { type: string }
            relations: { type: array, items: { type: object } }
    ReceiptVerified:
      type: object
      required: [hash, receipt, result]
      properties:
        hash: { type: string }
        receipt: { $ref: "#/components/schemas/Receipt" }
        result:
          type: object
          required: [reproduced, intact, derived_hash]
          properties:
            reproduced: { type: boolean, description: re-derived at the watermark, the same value }
            intact: { type: boolean, description: the file on disk still hashes to its name }
            stored_hash: { type: string }
            derived_hash: { type: string }
            missing: { type: array, items: { type: string } }
            unexpected: { type: array, items: { type: string } }
            notes: { type: array, items: { type: string } }
    Published:
      allOf:
        - { $ref: "#/components/schemas/Timeline" }
        - type: object
          required: [receipt_hash, receipt, page]
          properties:
            receipt_hash: { type: string }
            receipt: { $ref: "#/components/schemas/Receipt" }
            page: { $ref: "#/components/schemas/Page", description: "the first page; shown is its total_count" }
    Projections:
      type: object
      required: [projections]
      properties:
        projections:
          type: array
          items:
            type: object
            required: [name, origin, current, versions, description, types, shape, hash]
            properties:
              name: { type: string }
              origin: { type: string, enum: [bundled, registered] }
              current: { type: integer }
              versions: { type: array, items: { type: integer } }
              description: { type: string }
              types: { type: array, items: { type: string } }
              shape: { type: string, enum: [log, snapshot] }
              hash: { type: string }
    ProjectionManifest:
      type: object
      description: a projection template, as docs/ARCHITECTURE.md and internal/projection define it
      required: [name, version, types, statuses, max_classification]
      properties:
        name: { type: string }
        version: { type: integer, minimum: 1 }
        description: { type: string }
        types: { type: array, items: { type: string } }
        statuses: { type: array, items: { type: string } }
        max_classification: { type: string }
        from: { type: string }
        to: { type: string }
        shape: { type: string, enum: [log, snapshot] }
    RegisteredProjection:
      type: object
      required: [name, version, hash, new]
      properties:
        name: { type: string }
        version: { type: integer }
        hash: { type: string }
        new: { type: boolean }
    Checkpoints:
      type: object
      required: [db, checkpoints]
      properties:
        db: { type: string }
        checkpoints:
          type: array
          items:
            type: object
            required: [span_id, v, covers_w, value_hash, minted_at]
            properties:
              span_id: { type: string }
              v: { type: integer }
              covers_w: { type: integer, format: int64 }
              value_hash: { type: string }
              minted_at: { $ref: "#/components/schemas/AnamTime" }
    Mint:
      type: object
      required: [w, written, full, outcomes]
      properties:
        w: { type: integer, format: int64 }
        written: { type: boolean, description: false for a dry run }
        full: { type: boolean }
        from: { type: integer, format: int64 }
        outcomes:
          type: array
          items:
            type: object
            required: [span_id, v, covers_w, value_hash, len, minted]
            properties:
              span_id: { type: string }
              v: { type: integer }
              covers_w: { type: integer, format: int64 }
              value_hash: { type: string }
              len: { type: integer }
              minted: { type: boolean }
    Definitions:
      type: object
      required: [definitions]
      properties:
        definitions:
          type: array
          items:
            type: object
            required: [type, origin, current, versions]
            properties:
              type: { type: string }
              origin: { type: string, enum: [bundled, registered] }
              current: { type: integer }
              versions: { type: array, items: { type: integer } }
    DefinitionManifest:
      type: object
      description: a Definition as published; the schema is JSON Schema 2020-12, closed
      required: [meta, schema]
      properties:
        meta:
          type: object
          required: [facet_type, definition_version, classification, validation_mode, source_schema, schema_version, media_type, payload_kind, time_semantics, identity_key]
          properties:
            facet_type: { type: string }
            definition_version: { type: integer, minimum: 1 }
            classification: { type: string }
            validation_mode: { type: string }
            source_schema: { type: string }
            schema_version: { type: integer }
            media_type: { type: string }
            payload_kind: { type: string }
            time_semantics:
              type: object
              required: [fact_time]
              properties:
                fact_time:
                  type: object
                  required: [pointer, layout, zone]
                  properties:
                    pointer: { type: string, example: /date }
                    layout: { type: string, example: "2006-01-02 15:04" }
                    zone: { type: string, example: Australia/Sydney }
            identity_key: { type: array, items: { type: string } }
            min_binding_assurance: { type: string, enum: [low, medium, high] }
            series:
              type: object
              required: [name, key]
              properties:
                name: { type: string }
                key: { type: array, items: { type: string } }
                closes: { type: boolean }
        schema: { type: object, description: JSON Schema 2020-12 }
        handling: { type: object, description: what every writer of the type agrees on, served verbatim; guidance is prose by convention }
    Registered:
      type: object
      required: [type, version, new]
      properties:
        type: { type: string }
        version: { type: integer }
        new: { type: boolean }
    Submission:
      type: object
      required: [envelopes]
      properties:
        envelopes:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Envelope" }
        snapshot: { $ref: "#/components/schemas/SnapshotPart" }
    Envelope:
      type: object
      required: [type, definition_version, payload]
      properties:
        type: { type: string }
        definition_version: { type: integer, description: the type's current version }
        source_ref: { type: string, description: optional; the gate composes it from the identity key and checks it when sent }
        payload: { description: the fact, shaped to the Definition }
        asserted_person: { type: string, description: the person's id; set, the binding is high assurance }
        span_hint: { type: string }
    SnapshotPart:
      type: object
      required: [id, part, parts, types]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        part: { type: integer, minimum: 1 }
        parts: { type: integer, minimum: 1 }
        types: { type: array, items: { type: string } }
    SnapshotProgress:
      type: object
      required: [id, parts, parts_admitted, complete]
      properties:
        id: { type: string }
        parts: { type: integer }
        parts_admitted: { type: integer }
        complete: { type: boolean }
    SnapshotReport:
      allOf:
        - { $ref: "#/components/schemas/SnapshotProgress" }
        - type: object
          required: [source, types, carried, started_at, started_w]
          properties:
            source: { type: string }
            types: { type: array, items: { type: string } }
            carried: { type: integer }
            started_at: { $ref: "#/components/schemas/AnamTime" }
            started_w: { type: integer, format: int64 }
            completed_at: { $ref: "#/components/schemas/AnamTime" }
            completed_w: { type: integer, format: int64 }
            live: { type: integer }
            absent: { type: integer }
            absent_ids: { type: array, items: { type: string } }
    Admission:
      type: object
      required: [w, changed, results]
      properties:
        w: { type: integer, format: int64 }
        changed: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [index, outcome, facet_id, artifact_version]
            properties:
              index: { type: integer }
              outcome: { type: string, enum: [admitted, superseded, no-op] }
              facet_id: { type: string, format: uuid }
              artifact_version: { type: integer }
        snapshot: { $ref: "#/components/schemas/SnapshotProgress" }
    Refusal:
      type: object
      required: [error, refused]
      properties:
        error: { type: string }
        refused:
          type: array
          items:
            type: object
            required: [index, type, reason]
            properties:
              index: { type: integer }
              type: { type: string }
              reason: { type: string }
    StoredDocument:
      type: object
      required: [sha256, bytes, media_type, new]
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        bytes: { type: integer, format: int64 }
        media_type: { type: string }
        new: { type: boolean }
    RetractRequest:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source: { type: string, description: the source the facet must belong to; a guard, not a selector }
    Retraction:
      type: object
      required: [facet_id, source, type, artifact_version, outcome, w]
      properties:
        facet_id: { type: string }
        source: { type: string }
        type: { type: string }
        artifact_version: { type: integer, description: the version the tombstone marks }
        outcome: { type: string, enum: [tombstoned, no-op] }
        seq: { type: integer, format: int64, description: the anam-event's position; absent for a no-op }
        w: { type: integer, format: int64, description: the watermark after the request }
    EntryRequest:
      type: object
      required: [type, definition_version, payload]
      additionalProperties: false
      properties:
        type: { type: string, description: a type on the workbench principal's types }
        definition_version: { type: integer, description: the version the form was drawn from; 409 unless it is the type's version in force }
        payload: { type: object, description: shaped to that Definition; the identity field may be left out when the type declares an identity_template }
    Entry:
      type: object
      required: [outcome, facet_id, artifact_version, w]
      properties:
        outcome: { type: string, enum: [admitted, superseded, no-op] }
        facet_id: { type: string, format: uuid }
        artifact_version: { type: integer }
        seq: { type: integer, format: int64, description: the anam-event the entry wrote; absent for a no-op }
        w: { type: integer, format: int64, description: the watermark after the request }
    Backup:
      type: object
      required: [path, w, bytes, files]
      properties:
        path: { type: string }
        w: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        files: { type: integer }
        pruned: { type: array, items: { type: string } }
