  /v1/projections:
    get:
      operationId: getProjections
      tags: [catalogue]
      x-anam-roles: [reader, importer, operator]
      x-anam-type: Projections
      summary: The projection templates a reader may select.
      responses:
        "200":
          description: every template, its newest version and every version held
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Projections" }
              example:
                projections:
                  - name: meds
                    origin: bundled
                    current: 1
                    versions: [1]
                    description: The current regimen, the latest statement about each course.
                    types: [health.medication-started, health.medication-dose-changed, health.medication-stopped]
                    shape: snapshot
                    hash: sha256:7a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: postProjections
      tags: [operate]
      x-anam-roles: [operator]
      x-anam-type: RegisteredProjection
      summary: Register a projection template.
      description: >-
        201 a new version, 200 the same body again at a held version, 409 another body
        at a held version or a version behind the current, 422 a bad manifest or a type
        with no Definition.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectionManifest" }
      responses:
        "200":
          description: already held, unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisteredProjection" }
        "201":
          description: registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisteredProjection" }
              example: { name: meds, version: 2, hash: sha256:7a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9, new: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Immutable" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422": { $ref: "#/components/responses/BadManifest" }
        "503": { $ref: "#/components/responses/Busy" }
  /v1/projections/{name}:
    get:
      operationId: getProjectionCurrent
      tags: [catalogue]
      x-anam-roles: [reader, importer, operator]
      summary: A template's manifest at its current version, as canonical JSON.
