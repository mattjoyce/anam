<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>anam — anam-events</title>
{{template "style.html"}}
</head>
<body>
<header>
  <h1>anam-events</h1>
  {{template "nav.html"}}
</header>

<p class="meta">watermark <strong>W = {{.W}}</strong> · every event advances it: W ≡ seq</p>

<div class="scroll">
<table>
  <thead><tr><th>seq</th><th>anam time</th><th>kind</th><th>facet</th><th>artifact v</th></tr></thead>
  <tbody>
    {{range .Events}}
    <tr>
      <td>{{.Seq}}</td>
      <td class="mono">{{.AnamTimeText}}</td>
      <td><span class="kind kind-{{.Kind}}">{{.Kind}}</span></td>
      <td class="mono"><a href="/facet?id={{.FacetID}}">{{.FacetID}}</a></td>
      <td>{{.ArtifactVersion}}</td>
    </tr>
    {{else}}
    <tr><td colspan="5" class="dim">no anam-events yet</td></tr>
    {{end}}
  </tbody>
</table>
</div>
</body>
</html>
