<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>anam — location</title>
{{template "style.html"}}
<style>
  .controls { margin: .6rem 0; font-size: .9rem; display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
  .controls input[type=text], .controls input:not([type]) { font: inherit; padding: .15rem .35rem; width: 13.5rem; }
  .nav a { display: inline-block; min-width: 1.6em; text-align: center; padding: .1rem .3rem; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: 6px; text-decoration: none; margin-right: .15rem; }
</style>
</head>
<body>
<header>
  <h1>anam location</h1>
  {{template "nav.html"}}
</header>

<p class="meta">watermark <strong>W = {{.W}}</strong> · the live <span class="mono">place.track</span> hours in a window, drawn on one plane (card 133)</p>

<form class="controls" method="get" action="/location">
  <label>from <input name="from" id="from" value="{{.From}}" placeholder="2026-10-12 or RFC 3339"></label>
  <label>to <input name="to" id="to" value="{{.To}}" placeholder="2026-10-13 or RFC 3339"></label>
  {{if .Devices}}<label>device <select name="device"><option value="">any</option>{{range .Devices}}<option{{if eq . $.Device}} selected{{end}}>{{.}}</option>{{end}}</select></label>{{end}}
  <button type="submit">draw</button>
  {{if .Track}}<span class="nav">
    <a href="{{.Nav.Left}}" title="earlier">◀</a>
    <a href="{{.Nav.Out}}" title="wider">−</a>
    <a href="{{.Nav.In}}" title="narrower">+</a>
    <a href="{{.Nav.Right}}" title="later">▶</a>
  </span>{{end}}
  <a href="/location">newest day</a>
</form>

{{if .Track}}{{template "track.html" .Track}}{{else}}<p class="dim">{{.Empty}}</p>{{end}}
</body>
</html>
