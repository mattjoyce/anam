{{define "style.html"}}
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Full width is a per-viewer preference, applied before first paint so the page
  // does not jump; the browser remembers it, Anam does not (card 131).
  try { if (localStorage.getItem('anam.wide') === '1') document.documentElement.classList.add('wide'); } catch (e) {}
</script>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 72rem; padding: 0 1rem; }
  html.wide body { max-width: none; }
  nav button { font: inherit; font-size: .85rem; margin-left: .75rem; padding: 0 .4rem; cursor: pointer; }
  header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid currentColor; padding-bottom: .5rem; }
  h1 { font-size: 1.3rem; margin: 0; }
  h2 { font-size: 1.05rem; margin-top: 2rem; }
  nav a { margin-left: .75rem; }
  table { border-collapse: collapse; width: 100%; margin-top: .75rem; }
  th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); vertical-align: top; }
  thead th { border-bottom: 2px solid currentColor; }
  table.kv th { width: 11rem; font-weight: 600; }
  pre { padding: 1rem; overflow-x: auto; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: 6px; }
  .mono { font-family: ui-monospace, monospace; font-size: .85rem; }
  .dim { opacity: .6; }
  .meta { margin-top: 1rem; }
  .kind { padding: .1rem .5rem; border-radius: 99px; font-size: .8rem; border: 1px solid currentColor; }
  .kind-tombstoned, .kind-rejected { color: #b3261e; }
  .kind-superseded { color: #7a5c00; }
  .kind-admitted, .kind-endorsed { color: #1a7f37; }
  /* JSON, colour-coded the way an editor shows it */
  pre.json { line-height: 1.45; }
  .j-key { color: #0451a5; } .j-str { color: #a31515; } .j-num { color: #098658; } .j-lit { color: #0000ff; } .j-pun { opacity: .55; }
  @media (prefers-color-scheme: dark) {
    .j-key { color: #9cdcfe; } .j-str { color: #ce9178; } .j-num { color: #b5cea8; } .j-lit { color: #569cd6; }
  }
  .role { display: inline-block; padding: 0 .4rem; margin-right: .25rem; border-radius: 4px; font-size: .75rem; border: 1px solid currentColor; opacity: .85; }
  .undescribed { opacity: .55; font-style: italic; }
  .scroll { overflow-x: auto; }
  /* long pointers wrap in the two tables that hold them; wide lists scroll sideways instead */
  table.kv td.mono, table.kv td .mono, table.fields td.mono, table.fields td .mono { overflow-wrap: anywhere; }
  .role { font-family: system-ui, sans-serif; }
  /* the Workbench's entry form and its buttons */
  form.entry .field { display: grid; grid-template-columns: 12rem 1fr; gap: .15rem .75rem; margin: .8rem 0; }
  form.entry label { font-weight: 600; padding-top: .25rem; }
  form.entry input, form.entry select { font: inherit; padding: .2rem .4rem; max-width: 28rem; }
  form.entry input[readonly] { opacity: .7; }
  form.entry .hint, form.entry .problem { grid-column: 2; font-size: .85rem; }
  form.entry .problem, .message { color: #b3261e; }
  form.entry .bad input, form.entry .bad select { border-color: #b3261e; }
  .message { border: 1px solid currentColor; border-radius: 6px; padding: .5rem .8rem; }
  details.guidance { margin: 1rem 0; } details.guidance p { margin: .4rem 0; }
  .actions { display: flex; gap: .75rem; align-items: center; margin: 1rem 0 0; }
  .actions form { margin: 0; } .actions button, .actions .button { font: inherit; padding: .2rem .7rem; cursor: pointer; }
  @media (max-width: 40rem) { form.entry .field { grid-template-columns: 1fr; } form.entry .hint, form.entry .problem { grid-column: 1; } }
  @media (max-width: 40rem) {
    body { margin: 1rem auto; font-size: 14px; }
    header { flex-direction: column; }
    nav a { margin: 0 .5rem 0 0; }
    th, td { padding: .3rem .35rem; }
    table.kv th { width: auto; }
    /* a field's cells stack: name and roles, then type, then what it means */
    table.fields thead { display: none; }
    table.fields tr { display: block; padding: .4rem 0; border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
    table.fields td { display: block; border: 0; padding: .1rem .35rem; }
  }
</style>
{{end}}
