<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anam timeline feed (card 275 prototype)</title>
<style>
:root {
  --bg:#faf9f5; --surface:#fffefa; --text:#242c28; --muted:#616b64; --accent:#27644e; --on-accent:#fffefa;
  --line:#e7e4d9; --line2:#d3cfc0; --wash:#f1efe6; --sel:#eef3ec;
  --h-record:#2a78d6; --h-place:#eb6834; --h-money:#1baf7a; --h-activity:#eda100; --h-org:#008300;
  --h-mind:#4a3aa7; --h-health:#e34948; --h-other:#898781;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tb:104px; --lh:0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#1b211e; --surface:#222925; --text:#e7eadf; --muted:#a8b5aa; --accent:#9ac9ae; --on-accent:#1b211e;
    --line:#2f3833; --line2:#414c45; --wash:#262e29; --sel:#27332c;
    --h-record:#3987e5; --h-place:#d95926; --h-money:#199e70; --h-activity:#c98500;
    --h-mind:#9085e9; --h-health:#e66767;
    color-scheme: dark;
  }
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 var(--sans); }
button { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
.d-record{--hue:var(--h-record)} .d-place{--hue:var(--h-place)} .d-money{--hue:var(--h-money)}
.d-activity{--hue:var(--h-activity)} .d-org{--hue:var(--h-org)} .d-mind{--hue:var(--h-mind)}
.d-health{--hue:var(--h-health)} .d-other{--hue:var(--h-other)}

/* top bar */
#top { position:sticky; top:0; z-index:30; background:var(--bg); border-bottom:1px solid var(--line); padding:.6rem 1.25rem .5rem; }
.row { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem .9rem; }
.row + .row { margin-top:.4rem; }
.brand { font:600 1.15rem var(--serif); letter-spacing:.01em; }
.brand span { font:400 .85rem var(--sans); color:var(--muted); margin-left:.4rem; }
#q { flex:1 1 220px; max-width:420px; min-width:140px; font:inherit; padding:.4rem .7rem; border:1px solid var(--line2); border-radius:8px; background:var(--surface); color:var(--text); }
.seg { display:inline-flex; border:1px solid var(--line2); border-radius:8px; overflow:hidden; }
.seg button { border:0; background:transparent; padding:.3rem .7rem; font-size:.82rem; color:var(--muted); cursor:pointer; }
.seg button + button { border-left:1px solid var(--line2); }
.seg button[aria-pressed=true] { background:var(--accent); color:var(--on-accent); }
.win { font-weight:600; }
.basis, .count, .muted { color:var(--muted); font-size:.85rem; }
.basis { font-family:var(--mono); font-size:.78rem; border:1px solid var(--line2); border-radius:999px; padding:.05rem .55rem; }
.linkbtn { background:none; border:0; padding:0; color:var(--accent); text-decoration:underline; cursor:pointer; font-size:.88rem; }
.pillbtn { border:1px solid var(--line2); background:var(--surface); border-radius:8px; padding:.3rem .7rem; cursor:pointer; font-size:.85rem; }
.pillbtn:hover { border-color:var(--accent); }
.pillbtn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
#menu { display:none; }
.fchip { border:1px solid var(--line2); background:var(--surface); border-radius:999px; padding:.1rem .6rem; font-size:.8rem; cursor:pointer; }
.fchip:hover { border-color:var(--accent); }

/* layout */
#app { display:grid; grid-template-columns:262px minmax(0,1fr) 352px; align-items:start; }
#side, #insp { position:sticky; top:var(--tb); height:calc(100vh - var(--tb)); overflow:auto; padding:1rem 1rem 3rem; }
#side { border-right:1px solid var(--line); }
#insp { border-left:1px solid var(--line); background:var(--bg); }
#feed { min-width:0; padding:0 1.5rem 6rem; --cols:1fr; }
#backdrop { display:none; }

/* sidebar */
.sec { margin-bottom:1.4rem; }
.sec h4 { margin:0 0 .45rem; font:600 .72rem var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.lst { list-style:none; margin:0; padding:0; }
.srow { display:flex; align-items:center; gap:.4rem; width:100%; border:0; background:transparent; text-align:left; padding:.22rem .4rem; border-radius:6px; cursor:pointer; font-size:.88rem; }
.srow:hover { background:var(--wash); }
.srow[aria-pressed=true], .srow.on { background:var(--sel); font-weight:600; }
.srow .lbl { overflow-wrap:anywhere; min-width:0; }
.srow .cb { flex:none; width:.9rem; height:.9rem; border:1.5px solid var(--line2); border-radius:3px; background:var(--surface); position:relative; }
.srow[aria-pressed=true] .cb { background:var(--accent); border-color:var(--accent); }
.srow[aria-pressed=true] .cb::after { content:''; position:absolute; left:.22rem; top:.05rem; width:.25rem; height:.5rem; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
.srow.mixed .cb::after { content:''; position:absolute; left:.18rem; top:.33rem; width:.4rem; height:2px; background:var(--accent); }
.srow.fam { font-weight:500; margin-top:.2rem; }
.srow.fam + .srow.mono { padding-left:1.4rem; }
.srow.mono:not(.fam) { padding-left:1.4rem; }
.srow .n { margin-left:auto; color:var(--muted); font-size:.78rem; font-variant-numeric:tabular-nums; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--hue,var(--muted)); flex:none; }
.tree-dom { display:flex; align-items:center; }
.tree-dom .tog { border:0; background:none; cursor:pointer; width:1.5rem; color:var(--muted); padding:.2rem 0; }
.types { margin-left:1.5rem; }
.types .srow { font-size:.83rem; }
.mono { font-family:var(--mono); }
.month { display:grid; grid-template-columns:5.6rem 1fr 2.2rem; align-items:center; gap:.4rem; width:100%; border:0; background:transparent; padding:.18rem .4rem; border-radius:6px; cursor:pointer; font-size:.83rem; text-align:left; }
.month:hover { background:var(--wash); }
.month.on { background:var(--sel); box-shadow:inset 3px 0 0 var(--accent); font-weight:600; }
.month .bar { height:6px; background:var(--wash); border-radius:3px; overflow:hidden; }
.month .bar i { display:block; height:100%; background:var(--accent); opacity:.65; border-radius:3px; }
.month .n { text-align:right; color:var(--muted); font-size:.78rem; font-variant-numeric:tabular-nums; }
.saveform { display:flex; gap:.3rem; margin-top:.5rem; }
.saveform input, .jump input { flex:1; min-width:0; font:inherit; font-size:.85rem; padding:.28rem .5rem; border:1px solid var(--line2); border-radius:6px; background:var(--surface); color:var(--text); }
.jump { margin-bottom:.5rem; }
.keys { font-size:.78rem; color:var(--muted); line-height:1.7; }
kbd { font:.75rem var(--mono); border:1px solid var(--line2); border-bottom-width:2px; border-radius:4px; padding:0 .3rem; background:var(--surface); }

/* feed */
.lanehead { position:sticky; top:var(--tb); z-index:6; background:var(--bg); display:grid; grid-template-columns:var(--cols); gap:12px; padding:.45rem 0; border-bottom:1px solid var(--line); }
.lanehead[hidden] { display:none; }
.lh { display:flex; align-items:center; gap:.4rem; border:1px solid var(--line2); background:var(--surface); border-radius:8px; padding:.25rem .5rem; cursor:pointer; font-size:.82rem; min-width:0; overflow:hidden; white-space:nowrap; }
.lh b { font-weight:600; color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums; }
.lh .hint { color:var(--muted); font-size:.72rem; }
.lh.collapsed .nm, .lh.collapsed .hint { display:none; }
.lh.collapsed { padding:.25rem; justify-content:center; }
.lh.collapsed b { margin:0; }
#banner { padding-top:.8rem; }
.banner { background:var(--wash); border:1px solid var(--line2); border-radius:8px; padding:.5rem .8rem; font-size:.88rem; }
#newbar { position:sticky; top:calc(var(--tb) + var(--lh) + 6px); z-index:8; display:flex; justify-content:center; padding-top:.6rem; }
#newbar button { box-shadow:0 2px 10px rgba(0,0,0,.18); }
.day { margin-top:.2rem; }
.dayhead { position:sticky; top:calc(var(--tb) + var(--lh)); z-index:5; background:var(--bg); display:flex; align-items:baseline; gap:.7rem; padding:.9rem 0 .45rem; border-bottom:1px solid var(--line); margin-bottom:.5rem; }
.dayhead h3 { margin:0; font:600 1.08rem var(--serif); }
.dcount { color:var(--muted); font-size:.8rem; }
.items { position:relative; padding-left:28px; }
.items::before { content:""; position:absolute; left:6px; top:0; bottom:0; width:1px; background:var(--line2); }
.gap { position:relative; color:var(--muted); font-size:.78rem; padding:.15rem 0 .15rem 0; margin:.15rem 0; font-style:italic; display:flex; align-items:center; gap:.6rem; }
.gap::after { content:""; flex:1; border-top:1px dashed var(--line2); }
.gap-days { margin:.9rem 0 .5rem; padding-left:28px; }
.gap-days::before { content:""; }
.card { position:relative; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:.6rem .85rem .6rem; margin:.3rem 0; scroll-margin-top:calc(var(--tb) + var(--lh) + 70px); scroll-margin-bottom:60px; cursor:pointer; box-shadow:0 1px 0 rgba(0,0,0,.02); }
.card:hover { border-color:var(--line2); }
.card.cur { border-color:var(--line2); background:var(--sel); }
.card.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); background:var(--sel); }
.line1 { display:flex; align-items:baseline; gap:.65rem; min-width:0; }
.line1 time { font:.8rem var(--mono); color:var(--muted); flex:none; }
.label { font-weight:500; overflow-wrap:anywhere; }
.gut { position:absolute; left:-29px; top:.72rem; width:13px; display:flex; justify-content:center; background:var(--bg); padding:2px 0; }
.mark { display:block; width:11px; height:11px; background:var(--hue); }
.m-measure { border-radius:50%; }
.m-reading { border-radius:50%; background:var(--surface); border:2px solid var(--hue); }
.m-event { border-radius:2px; }
.m-period { width:6px; height:22px; border-radius:3px; }
.m-unknown { background:var(--surface); border:2px dashed var(--hue); border-radius:2px; }
.m-stack { width:11px; height:11px; border-radius:2px; box-shadow:3px 3px 0 -1px var(--surface), 3px 3px 0 0 var(--hue); }
.span { display:flex; align-items:center; flex-wrap:wrap; gap:.2rem .7rem; margin-top:.35rem; font-size:.82rem; color:var(--muted); }
.span .dur { color:var(--text); }
.span .bar { flex:1 0 100%; height:4px; border-radius:2px; background:var(--wash); }
.span .bar i { display:block; height:100%; border-radius:2px; background:var(--hue); opacity:.8; }
.chips { display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.4rem; }
.chip { display:inline-flex; align-items:center; gap:.35rem; font-size:.72rem; line-height:1.3; padding:.08rem .55rem .08rem .45rem; border:1px solid var(--line2); border-radius:999px; background:transparent; color:var(--muted); cursor:pointer; max-width:100%; }
.chip:hover { border-color:var(--accent); color:var(--text); }
.chip.dom::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--hue); }
.chip.warn { border-color:var(--text); color:var(--text); }
.chip.type { font-family:var(--mono); font-size:.7rem; }
.card.superseded { opacity:.78; }
.card.retracted .label { text-decoration:line-through; color:var(--muted); }
.card.retracted { opacity:.8; }
.group { margin:.3rem 0; }
.group-head { position:relative; display:flex; align-items:center; gap:.7rem; background:var(--wash); border:1px dashed var(--line2); border-radius:10px; padding:.55rem .85rem; cursor:pointer; scroll-margin-top:calc(var(--tb) + var(--lh) + 70px); }
.group-head.cur { border-color:var(--accent); }
.gsum { font-weight:500; }
.group-head .expander { margin-left:auto; flex:none; }
.members { margin:.3rem 0 .3rem 1rem; padding-left:.8rem; border-left:2px solid var(--line2); }
.lanes-grid { display:grid; grid-template-columns:var(--cols); gap:12px; align-items:start; }
.lane { min-width:0; }
.lane .gut { position:static; width:auto; background:none; padding:0; align-self:center; }
.lane .card { padding:.5rem .65rem; }
.lane .line1 { gap:.45rem; }
.lane .label { font-size:.88rem; }
.lane .group-head { padding:.45rem .6rem; flex-wrap:wrap; gap:.4rem; }
.lane .gut { margin-right:0; }
.lane-count { display:none; }
.lane.collapsed > * { display:none; }
.lane.collapsed > .lane-count { display:block; text-align:center; color:var(--muted); font-size:.82rem; padding-top:.5rem; }
.lanes .items::before { display:none; }
.foot { text-align:center; padding:1.6rem 0; color:var(--muted); }
.err { color:var(--text); background:var(--wash); border:1px solid var(--line2); border-radius:8px; padding:.6rem .9rem; display:inline-flex; align-items:center; gap:.8rem; }
.empty { padding:2.5rem 1rem; text-align:center; color:var(--muted); }
body.compact .card { padding:.28rem .7rem; margin:.15rem 0; }
body.compact .chips2 { display:none; }
body.compact .chips { margin-top:.2rem; }
body.compact .gut { top:.45rem; }
body.compact .group-head { padding:.3rem .7rem; }
body.compact .dayhead { padding:.5rem 0 .3rem; }

/* inspector */
#insp .ph { color:var(--muted); font-size:.9rem; margin-top:.4rem; }
.ih { display:flex; align-items:flex-start; gap:.5rem; }
.ih h2 { flex:1; margin:0 0 .4rem; font:600 1.35rem/1.25 var(--serif); overflow-wrap:anywhere; }
.iconbtn { border:1px solid var(--line2); background:var(--surface); border-radius:8px; width:2rem; height:2rem; cursor:pointer; flex:none; font-size:1.1rem; line-height:1; }
.iconbtn:hover { border-color:var(--accent); }
.acts { display:flex; flex-wrap:wrap; gap:.4rem; margin:.7rem 0 1rem; }
dl.meta { display:grid; grid-template-columns:7.5rem 1fr; gap:.35rem .8rem; margin:0 0 1rem; font-size:.86rem; }
dl.meta dt { color:var(--muted); }
dl.meta dd { margin:0; overflow-wrap:anywhere; }
#insp h5 { margin:1.1rem 0 .4rem; font:600 .72rem var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
table.kv { width:100%; border-collapse:collapse; font-size:.85rem; }
table.kv th, table.kv td { text-align:left; vertical-align:top; padding:.28rem .4rem .28rem 0; border-bottom:1px solid var(--line); }
table.kv th { font:.78rem var(--mono); color:var(--muted); font-weight:400; width:36%; }
table.kv td { overflow-wrap:anywhere; }
details { margin-top:.6rem; font-size:.85rem; }
summary { cursor:pointer; color:var(--muted); }
pre { background:var(--wash); border:1px solid var(--line); border-radius:8px; padding:.6rem; overflow:auto; font:.75rem/1.4 var(--mono); }
.idrow { display:flex; align-items:center; gap:.5rem; margin:.2rem 0; font-size:.78rem; }
.idrow code { font-family:var(--mono); overflow-wrap:anywhere; flex:1; color:var(--muted); }
.rel { list-style:none; padding:0; margin:0; }
.rel li { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:.5rem .65rem; margin-bottom:.4rem; font-size:.85rem; }
.rel .k { font:.72rem var(--mono); color:var(--muted); }
.rel button.linkbtn { text-align:left; display:block; margin-top:.2rem; }
.note { font-size:.82rem; color:var(--muted); margin:.5rem 0; }

@media (max-width: 1100px) { #app { grid-template-columns:220px minmax(0,1fr) 300px; } #feed { padding:0 1rem 6rem; } }
@media (max-width: 799px) {
  #app { display:block; }
  #menu { display:inline-flex; }
  #top { padding:.5rem .75rem; }
  #side { position:fixed; z-index:50; left:0; top:0; bottom:0; height:auto; width:min(86vw,320px); background:var(--bg); transform:translateX(-102%); transition:transform .2s; border-right:1px solid var(--line2); }
  body.drawer #side { transform:none; box-shadow:0 0 30px rgba(0,0,0,.3); }
  body.drawer #backdrop { display:block; position:fixed; inset:0; z-index:45; background:rgba(0,0,0,.4); }
  #insp { position:fixed; z-index:40; left:0; right:0; bottom:0; top:auto; height:auto; max-height:70vh; border-left:0; border-top:1px solid var(--line2); border-radius:14px 14px 0 0; visibility:hidden; transform:translateY(100%); transition:transform .2s, visibility .2s; box-shadow:0 -6px 24px rgba(0,0,0,.2); }
  body.insp-open #insp { visibility:visible; transform:none; }
  #feed { padding:0 .75rem 45vh; }
  .lanehead { display:none; }
  .lanes-grid { grid-template-columns:1fr; }
  .lane.collapsed > * { display:revert; }
  .lane .gut { position:static; }
}
@media (min-width: 800px) { .only-narrow { display:none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; animation:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<header id="top">
  <div class="row">
    <button id="menu" class="pillbtn" type="button" data-act="menu" aria-label="Open filters">&#9776; Filters</button>
    <div class="brand">Anam <span>timeline</span></div>
    <input id="q" type="search" placeholder="Search entries   ( / )" aria-label="Search entries" autocomplete="off">
    <div class="seg" role="group" aria-label="Density">
      <button type="button" data-act="density" data-v="comfortable">Comfortable</button>
      <button type="button" data-act="density" data-v="compact">Compact</button>
    </div>
    <div class="seg" role="group" aria-label="Layout">
      <button type="button" data-act="layout" data-v="stream">Stream</button>
      <button type="button" data-act="layout" data-v="lanes">Lanes</button>
    </div>
  </div>
  <div class="row">
    <span id="win" class="win"></span>
    <span id="basis" class="basis" title="The read basis. A real answer carries w (a watermark) and live (whether it is a live read)."></span>
    <button id="recent" class="linkbtn" type="button" data-act="recent" hidden>Back to recent</button>
    <span id="count" class="count" aria-live="polite"></span>
  </div>
  <div class="row" id="chips" hidden></div>
</header>
<div id="backdrop" data-act="drawer-close"></div>
<div id="app">
  <nav id="side" aria-label="Filters and navigation"></nav>
  <main id="feed" aria-label="Timeline">
    <div id="lanehead" class="lanehead" hidden></div>
    <div id="newbar" hidden></div>
    <div id="banner"></div>
    <div id="days"></div>
    <div id="foot" class="foot"></div>
  </main>
  <aside id="insp" aria-label="Inspector"></aside>
</div>
<noscript>This prototype needs JavaScript.</noscript>
<script src="fixture.js"></script>
<script>
'use strict';
(function () {

/* ================= 1. utilities ================= */

function h(tag, props) {
  var el = document.createElement(tag);
  if (props) for (var k in props) {
    var v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, kid) {
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { for (var i = 0; i < kid.length; i++) add(el, kid[i]); }
  else el.appendChild(typeof kid === 'object' ? kid : document.createTextNode(String(kid)));
}
function $(id) { return document.getElementById(id); }
function fmtInt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }

var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function dayNum(s) { var p = s.slice(0, 10).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
function dayStr(n) { return new Date(n * 864e5).toISOString().slice(0, 10); }
function fmtDay(s) { var p = s.split('-'); return DOW[new Date(dayNum(s) * 864e5).getUTCDay()] + ' ' + (+p[2]) + ' ' + MON[+p[1] - 1] + ' ' + p[0]; }
function fmtShort(s) { var p = s.split('-'); return (+p[2]) + ' ' + MON[+p[1] - 1]; }
function fmtDate(s) { var p = s.split('-'); return (+p[2]) + ' ' + MON[+p[1] - 1] + ' ' + p[0]; }
function fmtMonth(ym) { var p = ym.split('-'); return MON[+p[1] - 1] + ' ' + p[0]; }
function lastOfMonth(ym) { var p = ym.split('-'); return dayStr(Date.UTC(+p[0], +p[1], 0) / 864e5); }
function monthShift(ym, d) { var p = ym.split('-'); var dt = new Date(Date.UTC(+p[0], +p[1] - 1 + d, 1)); return dt.toISOString().slice(0, 7); }
function keyMin(k) { var d = k.split('T'), p = d[0].split('-'), t = (d[1] || '00:00').split(':'); return Date.UTC(+p[0], +p[1] - 1, +p[2], +t[0], +t[1]) / 6e4; }
function shiftLocal(k, mins) { return new Date((keyMin(k) + mins) * 6e4).toISOString().slice(0, 16); }
